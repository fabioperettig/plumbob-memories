<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <link rel="shortcut icon" type="image/png" href="assets/images/branding/TS-oldico.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/alert.css">
    <link rel="stylesheet" href="styles/footer.css">
    <link rel="stylesheet" href="styles/moods.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sono:wght@200..800&display=swap" rel="stylesheet">
    <title data-i18n="meta.title">Plumbob Memories: A Sim Nostalgia</title>
   
</head>
<body>

    <div id="header-footer"></div>

    <div id="cover" class="cover">
        <img
            id="plumbobStatus"
            src="assets/images/plumbobs/plumbob_green.webp"
            alt=""
            data-i18n-alt="plumbob.green"
            data-state="green"
        >
        <div id="coverText" class="coverText">
            <img src="assets/images/branding/TS-logo-main.png" alt="The Sims 1">
            <h3 data-i18n="cover.tagline"></h3>
            <button type="button" class="btn btn5" data-i18n="cover.explore"></button>
        </div>
    </div>

    <div id="module" class="module modWhats">
        <section class="section">
            <img
                src="assets/images/content/3240725-the-sims-screenshot.jpg"
                class="screenShot"
                alt=""
                data-i18n-alt="content.screenshotAlt"
            >
            <p data-i18n="content.about.paragraph1"></p>
        </section>
        <p data-i18n="content.about.paragraph2"></p>
        <p data-i18n="content.about.paragraph3"></p>
    </div>

    <div id="module" class="moduleb modWright">
        <img
            id="willImg"
            class="willImg"
            src="assets/images/content/Will_Wright2.png"
            alt=""
            data-i18n-alt="content.willWrightAlt"
        >
        <p data-i18n="content.wright"></p>
    </div>

    <div id="alerta" class="alert" role="dialog" aria-modal="true" aria-labelledby="alert-message" style="display:none">
        <div class="alert-row">
            <img
                src="assets/images/content/achievement-img.png"
                alt=""
                data-i18n-alt="alert.imageAlt"
            >
            <p id="alert-message" data-i18n="alert.message"></p>
        </div>
        <button type="button" class="btn btnCloseAlert" data-i18n="common.close"></button>
    </div>

    <div id="alert-border" class="alert-border" style="display:none"></div>

    <script src="scripts/i18n.js"></script>
    <script src="scripts/alert.js"></script>
    <script src="scripts/navigation.js"></script>
    <script src="scripts/mood-controller.js"></script>
    <script src="scripts/moods.js"></script>
    <script>
        async function initializePage() {
            const container = document.getElementById('header-footer');

            try {
                const response = await fetch('partials/header-footer.html');

                if (!response.ok) {
                    throw new Error(`Erro HTTP ${response.status}`);
                }

                container.innerHTML = await response.text();
                initializeLanguageMenu();
                await initializeI18n();
                initializeNavigation();
                initializeMoods();
                applyTranslations();
            } catch (error) {
                console.error('Não foi possível inicializar a página:', error);
            }
        }

        initializePage();
    </script>

</body>
</html>
